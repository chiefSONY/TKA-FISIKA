<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latihan Persiapan TKA : Gerak Parabola dan Fluida</title>
<style>
:root{--p:#193b56;--p2:#2e617f;--bg:#f3f6f8;--card:#fff;--line:#dfe6eb;--muted:#66727d;--ok:#137a52;--bad:#bd3c32}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#16222d;line-height:1.55}.hero{background:linear-gradient(135deg,#17354d,#2f617f);color:#fff;padding:34px 18px}.hero-in,.wrap{max-width:1050px;margin:auto}.hero h1{margin:5px 0;font-size:29px;line-height:1.15}.hero p{margin:7px 0;opacity:.85}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;max-width:1050px;margin:-18px auto 0;padding:0 18px}.timer{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 17px;box-shadow:0 8px 20px #15354d18;font-weight:900;color:var(--p)}.timer.danger{color:#b52e28}.wrap{padding:24px 18px}.info,.q,.result-card,.unlock{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin:17px 0;box-shadow:0 7px 20px #15354d09}.info{margin-top:0}.student-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.start{text-align:center;padding:20px}.btn{border:0;border-radius:11px;padding:12px 20px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.topic{display:inline-block;background:#e9f1f6;color:var(--p);padding:4px 9px;border-radius:99px;font-size:10px;font-weight:900}.stimulus{background:#f6f8fa;border-left:4px solid var(--p2);padding:12px 14px;border-radius:8px;margin:10px 0;font-size:14px}.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;cursor:pointer}.opt:hover{background:#f7fafb}.bs{display:grid;grid-template-columns:1fr 75px 75px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.bs div{padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}.hd{background:#f3f6f8;font-weight:800}.submitbar{position:sticky;bottom:12px;background:#ffffffeb;backdrop-filter:blur(8px);border:1px solid var(--line);padding:13px;border-radius:15px;text-align:center;box-shadow:0 9px 25px #15354d18}.score{font-size:30px;font-weight:950;color:var(--p)}.unlock{display:none}.unlock input{padding:11px;border:1px solid var(--line);border-radius:10px;margin-right:7px}.explain{background:#f6f8fa;border-radius:10px;padding:12px;margin-top:10px;font-size:13px}.good{background:#e7f6ee;color:#145f44;padding:12px;border-radius:10px}.bad{background:#fdecea;color:#8f2e27;padding:12px;border-radius:10px}footer{text-align:center;color:#89939b;font-size:11px;padding:30px}@media(max-width:650px){.student-grid{grid-template-columns:1fr}.hero h1{font-size:24px}.top{padding:0 10px}.wrap{padding:17px 10px}.q,.info,.result-card,.unlock{padding:16px}.bs{grid-template-columns:1fr 60px 60px}}
</style></head><body>
<section class="hero"><div class="hero-in"><div style="font-size:11px;font-weight:900;letter-spacing:1.5px;opacity:.75">TKA FISIKA SMA</div><h1>Latihan Persiapan TKA : Gerak Parabola dan Fluida</h1><p>10 soal • HOTS • SUKAR • Durasi 30 menit</p></div></section>
<div id="app"></div><footer>Latihan Persiapan TKA Fisika • Gerak Parabola & Fluida</footer>
<script>
let Q=[],attempt=null,timer=null,submitted=false;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}){const r=await fetch(url,opt);let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(x.error||"Terjadi kesalahan");return x}
function intro(){document.getElementById("app").innerHTML=`<div class="wrap">
<div class="info"><b>Identitas peserta</b><p style="margin:5px 0 12px;color:#66727d;font-size:13px">Username dibentuk dari <b>Nama-Kelas-No. Absen-Asal Sekolah</b>.</p>
<div class="student-grid"><div class="field"><label>Nama Lengkap</label><input id="name" placeholder="Nama lengkap"></div><div class="field"><label>Kelas</label><input id="kelas" placeholder="XI-2"></div><div class="field"><label>No. Absen</label><input id="absen" placeholder="12"></div><div class="field"><label>Asal Sekolah</label><input id="sekolah" placeholder="SMA BPK PENABUR HOLIS"></div></div></div>
<div class="info"><b>Ketentuan</b><ul style="font-size:13px;color:#55636e"><li>Durasi <b>30 menit</b>.</li><li>Countdown mengikuti waktu server dan tidak reset ketika halaman di-refresh.</li><li>Jawaban tersimpan ke server secara berkala.</li><li>Jika waktu habis, sistem otomatis submit.</li><li>Nilai muncul setelah submit/waktu habis.</li><li>Pembahasan terkunci sampai nilai dimasukkan sebagai password.</li></ul></div>
<div class="start"><button class="btn" onclick="start()">MULAI UJIAN 30 MENIT</button></div></div>`}
async function start(){try{const x=await api("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#name").value,kelas:$("#kelas").value,absen:$("#absen").value,sekolah:$("#sekolah").value})});attempt=x;const y=await api("/api/questions");Q=y.questions;renderExam();startTimer()}catch(e){alert(e.message)}}
async function resume(){try{const a=await api("/api/attempt");attempt=a;const y=await api("/api/questions");Q=y.questions;if(a.status==="active"){renderExam();startTimer()}else showResult(a)}catch{intro()}}
function renderExam(){document.getElementById("app").innerHTML=`<div class="top"><div style="font-size:12px;color:#66727d">Peserta: <b>${esc(attempt.name)}</b> • ${esc(attempt.kelas)} • Absen ${esc(attempt.absen)}</div><div id="timer" class="timer">30:00</div></div><div class="wrap"><div class="info">Jawaban tersimpan otomatis. Anda dapat mengganti jawaban sebelum submit.</div><div id="questions"></div><div class="submitbar"><button class="btn" onclick="submitExam(false)">SUBMIT JAWABAN</button></div></div>`;
let h="";Q.forEach(q=>{h+=`<section class="q"><span class="topic">${q.topic} • ${q.type}</span><h2 style="font-size:17px">Soal ${q.id}</h2><div class="stimulus">${esc(q.stimulus)}</div><p><b>${esc(q.question)}</b></p>`;
if(q.type==="Benar-Salah"){h+=`<div class="bs"><div class="hd">Pernyataan</div><div class="hd">Benar</div><div class="hd">Salah</div>`;q.statements.forEach((s,i)=>h+=`<div>${i+1}. ${esc(s)}</div><div><input type="radio" name="q${q.id}_${i}" value="B" onchange="saveAnswer(${q.id})"></div><div><input type="radio" name="q${q.id}_${i}" value="S" onchange="saveAnswer(${q.id})"></div>`);h+=`</div>`}
else q.options.forEach((o,i)=>h+=`<label class="opt"><input type="${q.type==="MCMA"?"checkbox":"radio"}" name="q${q.id}" value="${String.fromCharCode(65+i)}" onchange="saveAnswer(${q.id})"> <b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`);
h+="</section>"});$("#questions").innerHTML=h}
function getAnswer(q){if(q.type==="Benar-Salah")return q.statements.map((_,i)=>document.querySelector(`input[name="q${q.id}_${i}"]:checked`)?.value||null);return [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(x=>x.value)}
const pending={};
async function saveAnswer(id){const q=Q.find(x=>x.id===id),answer=getAnswer(q);clearTimeout(pending[id]);pending[id]=setTimeout(async()=>{try{await api("/api/save-answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({questionId:id,answer})})}catch{}},150)}
function startTimer(){clearInterval(timer);function tick(){const sec=Math.max(0,Math.floor((attempt.deadlineAt-Date.now())/1000)),m=String(Math.floor(sec/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0"),t=$("#timer");if(t){t.textContent=m+":"+s;if(sec<=300)t.classList.add("danger")}if(sec<=0){clearInterval(timer);submitExam(true)}}tick();timer=setInterval(tick,1000)}
async function submitExam(auto){if(submitted)return;submitted=true;clearInterval(timer);try{const x=await api("/api/submit",{method:"POST"});attempt.status=x.status;attempt.score=x.score;showResult(attempt,auto)}catch(e){submitted=false;alert(e.message)}}
function showResult(a,auto=false){document.getElementById("app").innerHTML=`<div class="wrap"><div class="result-card" style="text-align:center"><div class="${auto?"bad":"good"}">${auto?"⏰ Waktu 30 menit telah berakhir.":"✓ Jawaban berhasil disubmit."}</div><p style="color:#66727d">Peserta: <b>${esc(a.name)}</b> • ${esc(a.kelas)} • ${esc(a.absen)}</p><div>HASIL NILAI</div><div class="score">${a.score} / 10</div><p class="note">Gunakan nilai <b>${a.score}</b> sebagai password untuk membuka pembahasan.</p></div><div class="unlock" style="display:block"><h3>🔐 Buka Pembahasan</h3><p class="note">Masukkan hasil nilai Anda sebagai password.</p><input id="unlockPass" inputmode="numeric" placeholder="Masukkan nilai"><button class="btn" onclick="unlock()">BUKA PEMBAHASAN</button><div id="unlockMsg"></div></div><div id="discussion"></div></div>`}
async function unlock(){try{const x=await api("/api/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#unlockPass").value})});renderDiscussion(x.questions)}catch(e){$("#unlockMsg").innerHTML=`<div class="bad" style="margin-top:12px">${esc(e.message)}</div>`}}
function renderDiscussion(qs){let h=`<div class="result-card"><h2 style="font-size:20px">📘 Pembahasan Lengkap</h2><p class="note">Pembahasan terbuka setelah verifikasi nilai.</p></div>`;qs.forEach(q=>{const key=q.type==="Benar-Salah"?q.answer.map((x,i)=>`${i+1}=${x}`).join(", "):q.answer.join(", ");h+=`<section class="q"><span class="topic">${q.topic} • ${q.type}</span><h2>Soal ${q.id}</h2><p><b>Kunci: ${key}</b></p><div class="explain"><b>Pembahasan:</b> ${esc(q.explanation)}</div></section>`});$("#discussion").innerHTML=h;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
resume();
</script></body></html>
